[project]
name = "ad-user-lifecycle-api"
version = "1.0.0"
description = "API de solicitudes de altas, bajas y cambios de usuarios de Active Directory"
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["api/tests"]
addopts = "-ra"
filterwarnings = [
    # Starlette recientes recomiendan httpx2 para el TestClient; no afecta a los tests.
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S", "RUF"]
ignore = [
    "RUF001",  # textos en español con tildes
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"api/tests/**" = ["S101", "S106"]
